# Reference manifest for a `kubernetes.io/dockerconfigjson` Secret used to
# pull private images from AWS ECR. NEVER applied directly — this file is a
# template showing the shape. The actual Secret is created via
# `kubectl create secret …` (see README Module 17 Step 2).

apiVersion: v1
# ✅ What it does: pins this manifest to the core v1 API group.
# 🧠 Why it matters: Secret is a core resource — has been stable since the earliest K8s versions.
# 🌍 DevOps/Cloud: identical group across EKS / GKE / AKS / DOKS / Minikube — Secrets are universal.

kind: Secret
# ✅ What it does: declares this object as a Kubernetes Secret (base64-encoded credential blob).
# 🧠 Why it matters: Secrets are how K8s carries credentials into Pods without baking them into images.
# 🌍 DevOps/Cloud: every cloud provider treats Secrets the same way — Pods mount them or reference them via `imagePullSecrets`.

metadata:
  name: my-registry-key
  # ✅ What it does: names the Secret `my-registry-key` in the current namespace (`default`).
  # 🧠 Why it matters: this name is what the Deployment's `imagePullSecrets:` block will reference.
  # 🌍 DevOps/Cloud: keep names short + descriptive; one Secret per registry/account is the common pattern.

data:
  .dockerconfigjson: <base64-encoded-string>
  # ⚠️ Never paste real base64 credentials here.
  # Use `kubectl create secret` command instead.
  # Never commit real values to Git.
  # ✅ What it does: holds the entire `~/.docker/config.json` contents, base64-encoded.
  # 🧠 Why it matters: K8s reads this key when `type: kubernetes.io/dockerconfigjson` — kubelet uses it to auth against the registry.
  # 🌍 DevOps/Cloud: the key name `.dockerconfigjson` is hardcoded by K8s — must match exactly or kubelet silently ignores the Secret.

type: kubernetes.io/dockerconfigjson
# ✅ What it does: tells K8s this Secret carries Docker-registry credentials in config.json format.
# 🧠 Why it matters: only this Secret type can be referenced via `imagePullSecrets` on a Pod / Deployment.
# 🌍 DevOps/Cloud: the alternative `kubernetes.io/dockercfg` is the older legacy format — modern clusters use `dockerconfigjson`.
