# CI/CD pipeline for Module 16 — Helm Demo on DigitalOcean Managed Kubernetes (DOKS).
# Kubeconfig is provided via the KUBE_CONFIG repo secret (never committed to the repo).
name: Deploy to DOKS

on:
  # Manual trigger — usable once the workflow file lands on the default branch.
  workflow_dispatch:

  # Auto-deploy trigger — fires on every push to the module's feature branch.
  # main is NEVER triggered directly — follows the branch strategy in
  # .github/BRANCH-STRATEGY.md (feature -> k8s -> main).
  push:
    branches:
      - helm-demo-managed-k8s

jobs:
  # Placeholder build job — future steps will go here (e.g. docker build/push to a registry).
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build placeholder
        run: echo "Build step - coming soon (docker build/push will go here)"

  # Deploy job — authenticates against DOKS via kubeconfig from a GitHub Secret, then runs Helm.
  # All tooling is installed directly from upstream (kubernetes.io, helm.sh) — no third-party,
  # no Azure/AWS/GCP-specific actions.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Step 1 — pull the repo so workflow can reference any manifests or Helm value files.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — install kubectl directly from the official Kubernetes release server.
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      # Step 3 — write kubeconfig from the KUBE_CONFIG secret to ~/.kube/config.
      # The secret value is the full contents of the DigitalOcean kubeconfig YAML.
      - name: Configure kubeconfig from GitHub Secret
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Step 3b — verify kubeconfig is valid and cluster is reachable.
      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # Step 4 — install Helm directly from the official helm.sh installer script.
      - name: Set up Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o get_helm.sh
          chmod +x get_helm.sh
          ./get_helm.sh

      # Step 4b — confirm Helm is installed.
      - name: Verify Helm version
        run: helm version

      # Step 5 — add Bitnami Helm repository on the runner
      - name: Add Bitnami Helm repository
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      # Step 6 — update Helm repos to pull latest chart versions
      - name: Update Helm repositories
        run: helm repo update

      # Step 7 — confirm MongoDB chart is available before deploying
      - name: Verify MongoDB chart available
        run: helm search repo bitnami/mongodb

      # Step 8 — MongoDB Helm deploy coming next step
      - name: Deploy
        run: echo "MongoDB Helm deploy - coming next step"
